name: Academia Play — contract QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install -r sistema-maestro/requirements-dev.txt
      - name: Validate documentation consistency
        run: python sistema-maestro/scripts/doc_lint.py
      - name: Check generated schema parity
        run: |
          python sistema-maestro/scripts/build_contracts.py
          git diff --exit-code -- sistema-maestro/schemas
      - name: Run positive and negative contract tests
        run: python -m unittest discover -s sistema-maestro/tests -v
      - name: Validate synthetic v4.3 reconstructed curriculum dossier
        run: python sistema-maestro/scripts/validate_reconstructed_curriculum.py sistema-maestro/examples/reconstructed_curriculum_synthetic.json
      - name: Validate example manifest
        run: python sistema-maestro/scripts/validate_academia_play.py sistema-maestro/examples/manifest.json
      - name: Validate example progress
        run: python sistema-maestro/scripts/validate_academia_play.py sistema-maestro/examples/progress.json --kind progress
      - name: Validate example gate
        run: python sistema-maestro/scripts/validate_academia_play.py sistema-maestro/examples/gate.json --kind gate
      - name: Validate synthetic P0 templates
        run: |
          python sistema-maestro/scripts/validate_academia_play.py sistema-maestro/templates/gate-record.json --kind gate
          python sistema-maestro/scripts/validate_academia_play.py sistema-maestro/templates/continuity.json --kind continuity
      - name: Validate continuity checkpoint
        run: python sistema-maestro/scripts/validate_academia_play.py continuity.json --kind continuity
      - name: Validate synthetic execution event
        run: python sistema-maestro/scripts/validate_academia_play.py sistema-maestro/examples/execution_event.json --kind event
      - name: Validate Render bootstrap paths
        run: |
          test -f render.yaml
          test -f web/index.html
          test -f PROMPT_EJECUTOR_REPOSITORIO.md
          grep -q "Academia_Play" PROMPT_EJECUTOR_REPOSITORIO.md
      - name: Observe branch continuity without changing gates
        if: ${{ always() && github.repository == 'c2melendez/Academia_Play' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python sistema-maestro/scripts/branch_continuity.py
