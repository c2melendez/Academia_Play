name: Academia Play — F01 browser QA
on:
  pull_request:
    paths:
      - 'sistema-maestro/pilot/**'
      - 'sistema-maestro/scripts/**'
      - '.github/workflows/f01-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install playwright==1.51.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real browser pilot suite
        run: python -m unittest discover -s sistema-maestro/pilot -p 'test_f01_browser.py' -v
